<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d3b66" />
<title>Keke Kart</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="hudLeft">
    <div class="hudItem"><span class="lbl">LAP</span><span id="hudLap">1/3</span></div>
    <div class="hudItem"><span class="lbl">POS</span><span id="hudPlace">P1</span></div>
  </div>
  <div class="hudRight">
    <div class="hudItem speed"><span id="hudSpeed">0</span><span class="lbl">km/h</span></div>
  </div>
</div>

<div id="itemSlot" class="slot">—</div>

<div id="countdown"></div>

<div id="controls">
  <div id="steer"></div>
  <div id="btnRow">
    <button id="driftBtn" class="ctrlBtn">DRIFT</button>
    <button id="itemBtn" class="ctrlBtn">ITEM</button>
  </div>
</div>

<div id="overlay">
  <div class="panel">
    <h1>KEKE KART</h1>
    <p class="tag">Three laps. Five rivals. One street.</p>
    <p class="how">Hold <b>DRIFT</b> while turning to charge a boost.<br />Drag left or right to steer. Tap <b>ITEM</b> to fire.</p>
    <button id="startBtn">START RACE</button>
  </div>
</div>

<div id="results" class="hidden"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
